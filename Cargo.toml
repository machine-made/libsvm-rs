[workspace]
resolver = "2"
members = [
    "crates/libsvm",
    "bins/svm-train-rs",
    "bins/svm-predict-rs",
    "bins/svm-scale-rs",
]

[workspace.package]
version = "0.9.2"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/machine-made/libsvm-rs"
authors = ["Ricardo Frantz"]

[workspace.dependencies]
libsvm-rs = { path = "crates/libsvm", version = "0.9.2" }
thiserror = "2"
# Dev
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
float_cmp = "deny"
