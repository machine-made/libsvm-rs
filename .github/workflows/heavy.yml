# SPDX-License-Identifier: BSD-3-Clause
name: Heavy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/libsvm/src/**
      - .github/workflows/heavy.yml

permissions:
  contents: read

env:
  RAYON_NUM_THREADS: 2
  CARGO_BUILD_JOBS: 2

jobs:
  Kani:
    name: Kani (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        harness:
          - prove_element_budget_saturates
          - prove_lru_insert_delete_is_circular
          - prove_get_data_covers_request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: cargo-kani
          args: --output-format=terse --harness ${{ matrix.harness }}
