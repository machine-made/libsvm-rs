name: Fuzz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FUZZ_TOOLCHAIN: nightly-2026-03-08

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_problem, parse_model]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # nightly
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz target
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          MAX_TIME: ${{ github.event_name == 'schedule' && '7200' || '300' }}
        run: |
          cd crates/libsvm
          cargo +"$FUZZ_TOOLCHAIN" fuzz run "$FUZZ_TARGET" -- -max_total_time="$MAX_TIME"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crates/libsvm/fuzz/artifacts/
