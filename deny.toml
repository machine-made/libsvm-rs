[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = [
    { crate = "openssl-sys", reason = "native OpenSSL build scripts expand the trusted build surface" },
    { crate = "ring", reason = "native crypto build scripts expand the trusted build surface" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
